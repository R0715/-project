"/><circle cx="81.75" cy="119.215" r="0.7" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="94.45" cy="119.215" r="0.7" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="97.625" cy="119.215" r="0.7" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="100.8" cy="119.215" r="0.7" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="116.675" cy="119.215" r="0.7" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="116.675" cy="100.16499999999999" r="0.7" fill="none" stroke="#357160" stroke-width=".15"/><text x="81.75" y="98.66499999999999" font-size="1.65">U3</text><circle cx="56.35" cy="98.89500000000001" r="0.5" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="58.89" cy="98.89500000000001" r="0.5" fill="none" stroke="#357160" stroke-width=".15"/><circle cx="61.43" cy="98.89500000000001" r="0.5" fill="none" stroke="#357160" stroke-width=".15"/><text x="56.35" y="97.39500000000001" font-size="1.65">U4</text><text x="50" y="136" font-size="3">横向 100，沿车长 75。四个 Ø3.2 安装孔距相邻边各 5，横纵孔距 90 × 65。</text><text x="20" y="150" font-size="3.4">两排核心板母座中心距 15.24，单排针距 2.54。USB-C 朝车左，H2 下载口朝车右。</text><text x="20" y="160" font-size="3.4">J7、J11 为 5.08 端子。用实物连上线束试摆，再定车架孔位与插头开口。</text><text x="20" y="170" font-size="3.1">检查上层的相机线与 RDK 散热空间、板下支撑与螺钉净距，以及跳线和接线端子可达性。</text><path d="M22 185h50 M22 183v4 M72 183v4" fill="none" stroke="black" stroke-width=".25"/><text x="78" y="186" font-size="3.8">校验线 50 mm</text></g></svg>